</script>
  <script>
/* ============================================================
   错题拾遗 · 个人同步（GitHub secret Gist）
   可选功能：只在你自己的设备之间同步；不配置时完全本地。
   Token 只保存在浏览器 localStorage，不写进 GitHub Pages。
   ============================================================ */
'use strict';

const GIST_ID_KEY = 'cuoti_gist_id_v1';
const GIST_TOKEN_KEY = 'cuoti_gist_token_v1';
const GIST_META_KEY = 'cuoti_gist_meta_v1';
const GIST_FILE = 'cuoti.json';
const GIST_API = 'https://api.github.com';
const GIST_PROFILE_TS_KEY = 'cuoti_ky_profile_ts_v1';

let gistIdValue = safeGet(GIST_ID_KEY) || '';
let gistTokenValue = safeGet(GIST_TOKEN_KEY) || '';
let gistMeta = { version: 0, lastSync: null, updatedAt: null, deleted: {}, resetAt: null };
try {
  const raw = JSON.parse(safeGet(GIST_META_KEY) || 'null');
  if (raw && typeof raw === 'object') {
    gistMeta = {
      version: Number(raw.version) || 0,
      lastSync: raw.lastSync || null,
      updatedAt: raw.updatedAt || null,
      deleted: raw.deleted && typeof raw.deleted === 'object' ? raw.deleted : {},
      resetAt: raw.resetAt || null
    };
  }
} catch {}

let gistStatus = 'off';
let gistMessage = '';
let gistBusy = false;
let gistDirty = false;
let gistTimer = null;
let gistPoll = null;

const gistRawPut = Store.put.bind(Store);
const gistRawRemove = Store.remove.bind(Store);
const gistRawClear = Store.clear.bind(Store);
const gistRawBulk = Store.bulk.bind(Store);
const gistRawSaveLogs = saveLogs;
const gistRawSaveKyProfile = typeof saveKyProfile === 'function' ? saveKyProfile : null;

function gistConfigured() { return Boolean(gistIdValue && gistTokenValue); }
function saveGistConfig() {
  if (gistIdValue) safeSet(GIST_ID_KEY, gistIdValue); else localStorage.removeItem(GIST_ID_KEY);
  if (gistTokenValue) safeSet(GIST_TOKEN_KEY, gistTokenValue); else localStorage.removeItem(GIST_TOKEN_KEY);
}
function saveGistMeta() { safeSet(GIST_META_KEY, JSON.stringify(gistMeta)); }

Store.put = async (q) => { await gistRawPut(q); scheduleGist(); };
Store.remove = async (id) => {
  await gistRawRemove(id);
  gistMeta.deleted[id] = new Date().toISOString();
  saveGistMeta();
  scheduleGist();
};
Store.clear = async () => {
  await gistRawClear();
  gistMeta.resetAt = new Date().toISOString();
  gistMeta.deleted = {};
  saveGistMeta();
  scheduleGist();
};
Store.bulk = async (items) => { await gistRawBulk(items); scheduleGist(); };
saveLogs = function () { gistRawSaveLogs(); scheduleGist(); };
if (gistRawSaveKyProfile) {
  saveKyProfile = function () {
    gistRawSaveKyProfile();
    safeSet(GIST_PROFILE_TS_KEY, new Date().toISOString());
    scheduleGist();
  };
}

async function gistApi(path, options = {}) {
  if (!gistTokenValue) throw new Error('还没有填写 GitHub Token');
  const headers = {
    Accept: 'application/vnd.github+json',
    Authorization: 'Bearer ' + gistTokenValue,
    'X-GitHub-Api-Version': '2022-11-28',
    ...(options.headers || {})
  };
  const res = await fetch(GIST_API + path, { ...options, headers });
  if (!res.ok) {
    let detail = '';
    try { const j = await res.json(); detail = j.message || ''; } catch {}
    if (res.status === 401) throw new Error('Token 无效或已过期');
    if (res.status === 404) throw new Error('Gist 不存在，或 Token 没有 gist 权限');
    if (res.status === 403) throw new Error(detail || 'GitHub 拒绝了请求，可能是 Token 权限不够');
    throw new Error(detail || `GitHub 返回 ${res.status}`);
  }
  return res.json();
}

function gistEmpty() {
  return { questions: [], deleted: {}, logs: [], profile: {}, profileUpdatedAt: null, resetAt: null };
}
function isDemoQuestion(q) { return q && String(q.id || '').startsWith('demo_'); }
function hasRealQuestion(data) {
  return Boolean(data && (data.questions || []).some((q) => q && !isDemoQuestion(q)));
}
function stripDemoQuestions(data) {
  if (!data) return data;
  return { ...data, questions: (data.questions || []).filter((q) => !isDemoQuestion(q)) };
}
function gistLatest(a, b) {
  if (!a) return b || null;
  if (!b) return a;
  return a > b ? a : b;
}
function mergeGist(local, remote) {
  let l = local && typeof local === 'object' ? local : gistEmpty();
  const r = remote && typeof remote === 'object' ? remote : gistEmpty();
  // 新设备首次打开会自动生成 8 道示例题；如果云端已经有真实错题，
  // 不要把示例题混进云端。
  if (hasRealQuestion(r) && (l.questions || []).some(isDemoQuestion)) {
    l = stripDemoQuestions(l);
  }
  const resetAt = gistLatest(l.resetAt, r.resetAt);

  const deleted = { ...(r.deleted || {}) };
  for (const [id, at] of Object.entries(l.deleted || {})) {
    if (!deleted[id] || at > deleted[id]) deleted[id] = at;
  }
  if (resetAt) {
    for (const [id, at] of Object.entries(deleted)) {
      if (!at || at <= resetAt) delete deleted[id];
    }
  }

  const qmap = new Map();
  for (const q of r.questions || []) if (q && q.id) qmap.set(q.id, q);
  for (const q of l.questions || []) {
    if (!q || !q.id) continue;
    const old = qmap.get(q.id);
    if (!old || (q.updatedAt || '') > (old.updatedAt || '')) qmap.set(q.id, q);
  }
  for (const [id, at] of Object.entries(deleted)) {
    const q = qmap.get(id);
    if (q && (!at || at >= (q.updatedAt || ''))) qmap.delete(id);
  }
  if (resetAt) {
    for (const [id, q] of [...qmap.entries()]) {
      if ((q.updatedAt || '') <= resetAt) qmap.delete(id);
    }
  }

  const logs = new Map();
  for (const item of [...(r.logs || []), ...(l.logs || [])]) if (item && item.id) logs.set(item.id, item);
  let profile = r.profile || {};
  let profileUpdatedAt = r.profileUpdatedAt || null;
  if ((l.profileUpdatedAt || '') > (profileUpdatedAt || '')) {
    profile = l.profile || {};
    profileUpdatedAt = l.profileUpdatedAt;
  }
  return {
    questions: [...qmap.values()],
    deleted,
    logs: [...logs.values()].sort((a, b) => String(a.at || '').localeCompare(String(b.at || ''))).slice(-1000),
    profile,
    profileUpdatedAt,
    resetAt
  };
}
function collectGist() {
  return {
    questions: state.questions,
    deleted: gistMeta.deleted,
    logs: state.logs,
    profile: typeof kyProfile === 'object' ? kyProfile : {},
    profileUpdatedAt: safeGet(GIST_PROFILE_TS_KEY),
    resetAt: gistMeta.resetAt
  };
}

async function readGist() {
  const data = await gistApi('/gists/' + encodeURIComponent(gistIdValue));
  const file = data.files && data.files[GIST_FILE];
  if (!file) return { version: 0, updatedAt: null, data: gistEmpty() };
  let content = file.content || '';
  if (file.truncated && file.raw_url) {
    const r = await fetch(file.raw_url, { headers: { Authorization: 'Bearer ' + gistTokenValue } });
    if (!r.ok) throw new Error('Gist 内容读取失败');
    content = await r.text();
  }
  let parsed = {};
  try { parsed = JSON.parse(content || '{}'); } catch { parsed = {}; }
  if (parsed && parsed.data && typeof parsed.data === 'object') {
    return { version: Number(parsed.version) || 0, updatedAt: parsed.updatedAt || null, data: parsed.data };
  }
  return { version: 0, updatedAt: null, data: parsed && typeof parsed === 'object' ? parsed : gistEmpty() };
}

async function writeGist(record) {
  await gistApi('/gists/' + encodeURIComponent(gistIdValue), {
    method: 'PATCH',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ files: { [GIST_FILE]: { content: JSON.stringify(record) } } })
  });
}

async function createGist() {
  if (!gistTokenValue) throw new Error('先填写 GitHub Token');
  const record = { version: 0, updatedAt: new Date().toISOString(), data: gistEmpty() };
  const data = await gistApi('/gists', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      description: '错题拾遗 · 个人同步',
      public: false,
      files: { [GIST_FILE]: { content: JSON.stringify(record) } }
    })
  });
  gistIdValue = data.id;
  saveGistConfig();
}

function canRenderGist() {
  if (state.review) return false;
  if ($('#modalRoot') && $('#modalRoot').innerHTML.trim()) return false;
  const el = document.activeElement;
  if (el && el.matches && el.matches('input, textarea, select')) return false;
  return true;
}

async function applyGist(data, version, updatedAt) {
  const d = data && typeof data === 'object' ? data : gistEmpty();
  state.questions = Array.isArray(d.questions) ? d.questions.map(normalize) : [];
  state.logs = Array.isArray(d.logs) ? d.logs.slice(-1000) : [];
  gistMeta.deleted = d.deleted && typeof d.deleted === 'object' ? d.deleted : {};
  gistMeta.resetAt = d.resetAt || null;
  gistMeta.version = Number(version) || 0;
  gistMeta.updatedAt = updatedAt || null;
  gistMeta.lastSync = new Date().toISOString();
  saveGistMeta();
  try { localStorage.setItem(LS_LOGS, JSON.stringify(state.logs.slice(-800))); } catch {}
  if (d.profile && typeof d.profile === 'object' && d.profileUpdatedAt) {
    if (typeof kyProfile === 'object') {
      kyProfile = { ...kyProfile, ...d.profile };
      safeSet(KY_KEY, JSON.stringify(kyProfile));
      safeSet(GIST_PROFILE_TS_KEY, d.profileUpdatedAt);
    }
  }
  try { await gistRawBulk(state.questions); } catch (error) { console.warn('同步数据写本地失败', error); }
  updateNav();
  updateGistUI();
  if (canRenderGist()) render();
}

async function gistSync(manual = false) {
  if (!gistConfigured()) {
    gistStatus = 'off';
    updateGistUI();
    return;
  }
  if (gistBusy) return;
  gistBusy = true;
  gistStatus = 'syncing';
  updateGistUI();
  try {
    const remote = await readGist();
    const merged = mergeGist(collectGist(), remote.data);
    const record = {
      version: (Number(remote.version) || 0) + 1,
      updatedAt: new Date().toISOString(),
      data: merged
    };
    await writeGist(record);
    await applyGist(record.data, record.version, record.updatedAt);
    gistDirty = false;
    gistStatus = 'on';
    gistMessage = '';
    updateGistUI();
    if (manual) toast('个人同步完成');
  } catch (error) {
    console.warn('个人同步失败', error);
    gistDirty = true;
    gistStatus = 'error';
    gistMessage = error.message || '同步失败';
    updateGistUI();
    if (manual) toast('同步失败：' + gistMessage, 'error');
  } finally {
    gistBusy = false;
  }
}

async function gistPull() {
  if (!gistConfigured() || gistBusy) return;
  if (document.visibilityState !== 'visible') return;
  if ($('#modalRoot') && $('#modalRoot').innerHTML.trim()) return;
  if (gistDirty) { await gistSync(false); return; }
  try {
    const remote = await readGist();
    if (Number(remote.version) !== Number(gistMeta.version) || (remote.updatedAt || '') !== (gistMeta.updatedAt || '')) {
      await applyGist(remote.data, remote.version, remote.updatedAt);
      gistStatus = 'on';
      gistMessage = '';
      updateGistUI();
    }
  } catch (error) {
    gistStatus = 'error';
    gistMessage = error.message || '同步失败';
    updateGistUI();
  }
}

function scheduleGist() {
  if (!gistConfigured()) return;
  gistDirty = true;
  clearTimeout(gistTimer);
  gistTimer = setTimeout(() => gistSync(false), 900);
}

function gistStatusInfo() {
  if (!gistConfigured()) return { cls: '', label: '未开启', text: '不配置时，数据只保存在本机。' };
  if (gistStatus === 'on') return { cls: 'on', label: '已连接', text: '这台设备和你的其他设备已同步。' };
  if (gistStatus === 'syncing') return { cls: 'wait', label: '同步中', text: '正在和 GitHub Gist 交换数据…' };
  if (gistStatus === 'error') return { cls: 'err', label: '同步失败', text: gistMessage || '检查 Token 和 Gist ID。' };
  return { cls: '', label: '已配置', text: '点“立即同步”连接。' };
}

function updateGistUI() {
  const info = gistStatusInfo();
  const box = $('#gistStatus');
  if (box) {
    box.innerHTML = `<span class="sync-dot ${info.cls}"></span><strong>${info.label}</strong><span>${esc(info.text)}</span><span class="sync-when">${gistMeta.lastSync ? esc(fmtDateTime(gistMeta.lastSync)) : ''}</span>`;
  }
  const meta = document.querySelector('.sidebar-meta span:last-child');
  if (meta) {
    meta.textContent = gistConfigured()
      ? (gistStatus === 'on' ? '个人同步 · 已连接' : gistStatus === 'error' ? '个人同步 · 同步失败' : '个人同步 · 可多设备')
      : '本地保存 · 离线可用';
  }
}

function gistCard() {
  const info = gistStatusInfo();
  const configured = gistConfigured();
  return `<div class="card settings-card sync-card">
    <h3>${icon('repeat')}个人同步（可选）</h3>
    <p>只在你自己的电脑、平板之间同步。不配置时，数据仍然只存本机，不影响别人使用。</p>
    <div class="sync-status" id="gistStatus"><span class="sync-dot ${info.cls}"></span><strong>${info.label}</strong><span>${esc(info.text)}</span><span class="sync-when">${gistMeta.lastSync ? esc(fmtDateTime(gistMeta.lastSync)) : ''}</span></div>
    ${configured ? `
      <div class="setting-actions">
        <button class="btn btn-primary" data-gist-action="now">${icon('refresh')}立即同步</button>
        <button class="btn btn-ghost" data-gist-action="disconnect">${icon('x')}断开同步</button>
      </div>
      <div class="sync-install-tip"><strong>Gist：</strong>${esc(gistIdValue.slice(0, 8))}…（Token 已保存在本机）<br>另一台设备打开同一个网页，填同一个 Gist ID 和 Token 即可。</div>
    ` : `
      <div class="form-grid" style="margin-top:12px">
        <label class="field"><span>GitHub Token</span><input id="gistTokenInput" type="password" autocomplete="off" placeholder="ghp_...（只勾 gist 权限）"></label>
        <label class="field"><span>Gist ID（第二台设备填写）</span><input id="gistIdInput" type="text" autocomplete="off" placeholder="第一台设备点“创建新 Gist”"></label>
      </div>
      <div class="setting-actions">
        <button class="btn btn-primary" data-gist-action="create">${icon('plus')}创建新 Gist 并连接</button>
        <button class="btn btn-ghost" data-gist-action="connect">${icon('link')}连接已有 Gist</button>
      </div>
      <div class="sync-install-tip">Token 只保存在这台设备的浏览器里，不会写进网页代码。只勾选 <strong>gist</strong> 权限，不要勾 repo。创建后把 Gist ID 填到另一台设备。</div>
    `}
  </div>`;
}
const baseSettingsGist = renderSettings;
renderSettings = function () {
  return baseSettingsGist().replace('<div class="settings-grid">', `<div class="settings-grid">${gistCard()}`);
};

function readGistInputs() {
  const tokenEl = $('#gistTokenInput');
  const idEl = $('#gistIdInput');
  if (tokenEl && tokenEl.value.trim()) gistTokenValue = tokenEl.value.trim();
  if (idEl && idEl.value.trim()) {
    const raw = idEl.value.trim();
    const m = raw.match(/gist\.github\.com\/[^/]+\/([a-f0-9]+)/i);
    gistIdValue = m ? m[1] : raw;
  }
}

function startGistPolling() {
  if (gistPoll) clearInterval(gistPoll);
  gistPoll = setInterval(() => {
    if (document.visibilityState === 'visible') gistPull();
  }, 15000);
}
function stopGistPolling() {
  if (gistPoll) clearInterval(gistPoll);
  gistPoll = null;
}

async function connectGist(create) {
  readGistInputs();
  if (!gistTokenValue) { toast('先填写 GitHub Token', 'error'); return; }
  if (!create && !gistIdValue) { toast('填写 Gist ID，或点“创建新 Gist”', 'error'); return; }
  saveGistConfig();
  gistStatus = 'syncing';
  updateGistUI();
  try {
    if (create) await createGist();
    await gistSync(true);
    startGistPolling();
    render();
  } catch (error) {
    gistStatus = 'error';
    gistMessage = error.message || '连接失败';
    updateGistUI();
    toast('连接失败：' + gistMessage, 'error');
    render();
  }
}

function disconnectGist() {
  if (!confirm('断开后，这台设备不再自动同步；GitHub 上的数据不会被删除。继续吗？')) return;
  stopGistPolling();
  gistIdValue = '';
  gistTokenValue = '';
  gistMeta = { version: 0, lastSync: null, updatedAt: null, deleted: {}, resetAt: null };
  saveGistConfig();
  saveGistMeta();
  gistStatus = 'off';
  gistMessage = '';
  updateGistUI();
  render();
  toast('已断开个人同步');
}

document.addEventListener('click', (event) => {
  const el = event.target.closest('[data-gist-action]');
  if (!el) return;
  event.preventDefault();
  if (el.dataset.gistAction === 'create') connectGist(true);
  if (el.dataset.gistAction === 'connect') connectGist(false);
  if (el.dataset.gistAction === 'now') gistSync(true);
  if (el.dataset.gistAction === 'disconnect') disconnectGist();
});

document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible' && gistConfigured()) gistSync(false);
});
window.addEventListener('online', () => { if (gistConfigured()) gistSync(false); });

function initGist() {
  updateGistUI();
  if (gistConfigured()) {
    gistSync(false);
    startGistPolling();
  }
}
function bootGist(tries = 0) {
  if (window.__CUOTI_READY__) { initGist(); return; }
  if (tries < 100) setTimeout(() => bootGist(tries + 1), 150);
}
document.addEventListener('DOMContentLoaded', () => setTimeout(() => bootGist(), 300));
window.__CUOTI_GIST__ = { gistSync, gistPull };

</script>

function syllabusChapters(subject) {
  if (SYLLABUS[subject]) return Object.keys(SYLLABUS[subject]);
  const mods = (typeof KY_MODULES !== 'undefined' && KY_MODULES[subject]) || [];
  return mods.length ? mods : ['自定义'];
}
function syllabusPoints(subject, chapter) {
  return (SYLLABUS[subject] && SYLLABUS[subject][chapter]) || ['自定义'];
}
function inferChapter(subject, topic) {
  if (!topic) return '';
  for (const ch of syllabusChapters(subject)) {
    if (ch === topic || syllabusPoints(subject, ch).includes(topic)) return ch;
  }
  return '';
}

function injectSyllabusPicker() {
  const topicInput = $('#qTopic');

/* ============================================================

'use strict';

function mindCount(subject, chapter, topic) {
  return state.questions.filter((q) =>
    q.subject === subject &&
    chapterOf(q) === chapter &&
    (q.topic === topic || (q.topic && q.topic.includes(topic)))
  );
}

function mindSvg(subject) {
  const qs = state.questions.filter((q) => q.subject === subject);
  const chapters = syllabusChapters(subject);
  const rowH = 54;
  const gap = 10;
  const topicW = 300;
  const chapterW = 150;
  const rootW = 128;
  const xRoot = 24;
  const xChapter = 200;
  const xTopic = 420;
  const nodes = [];
  let y = 32;
  const chapterList = [];
  for (const ch of chapters) {
    const pts = syllabusPoints(subject, ch);
    const leaves = [];
    for (const p of pts) {
      const list = mindCount(subject, ch, p);
      const types = {};
      list.forEach((q) => { const key = q.item || q.type; types[key] = (types[key] || 0) + 1; });
      const typeText = Object.entries(types).map(([k, v]) => `${k}${v}`).join(' · ');
      leaves.push({ topic: p, y: y + rowH / 2, count: list.length, un: list.filter((q) => q.status !== 'mastered').length, typeText });
      y += rowH + gap;
    }
    const chY = leaves.length ? (leaves[0].y + leaves[leaves.length - 1].y) / 2 : y;
    chapterList.push({ chapter: ch, y: chY, leaves, count: chapters.length ? qs.filter((q) => chapterOf(q) === ch).length : 0 });
  }
  const height = Math.max(420, y + 20);
  const rootY = height / 2;
  const paths = [];
  const groups = [];

  groups.push(`<g><rect x="${xRoot}" y="${rootY - 28}" width="${rootW}" height="56" rx="14" fill="#172522"/><text x="${xRoot + rootW / 2}" y="${rootY - 6}" text-anchor="middle" fill="#f7f1e5" font-size="13" font-weight="700">${esc(subject)}</text><text x="${xRoot + rootW / 2}" y="${rootY + 13}" text-anchor="middle" fill="#b9c8c1" font-size="10">${qs.length} 道 · 未掌握 ${qs.filter((q) => q.status !== 'mastered').length}</text></g>`);

  for (const c of chapterList) {
    const cy = c.y;
    paths.push(`<path d="M${xRoot + rootW} ${rootY} C${xRoot + rootW + 45} ${rootY}, ${xChapter - 45} ${cy}, ${xChapter} ${cy}" fill="none" stroke="#cfc3b1" stroke-width="1.5"/>`);
    groups.push(`<g><rect x="${xChapter}" y="${cy - 20}" width="${chapterW}" height="40" rx="10" fill="#fbf7ef" stroke="#d9cdbd"/><text x="${xChapter + chapterW / 2}" y="${cy - 3}" text-anchor="middle" fill="#1e2b2a" font-size="11" font-weight="700">${esc(c.chapter)}</text><text x="${xChapter + chapterW / 2}" y="${cy + 12}" text-anchor="middle" fill="#7a8783" font-size="9">${c.count} 道</text></g>`);
    for (const leaf of c.leaves) {
      paths.push(`<path d="M${xChapter + chapterW} ${cy} C${xChapter + chapterW + 35} ${cy}, ${xTopic - 35} ${leaf.y}, ${xTopic} ${leaf.y}" fill="none" stroke="#e0d6c8" stroke-width="1.2"/>`);
      const accent = leaf.un ? '#d45a3e' : leaf.count ? '#2f6d62' : '#cfc3b1';
      groups.push(`<g class="mindmap-topic" data-syllabus-subject="${esc(subject)}" data-syllabus-topic="${esc(leaf.topic)}" style="cursor:pointer"><rect x="${xTopic}" y="${leaf.y - 22}" width="${topicW}" height="44" rx="10" fill="${leaf.count ? '#fffdf8' : '#fbf7ef'}" stroke="${accent}"/><text x="${xTopic + 12}" y="${leaf.y - 5}" fill="#1e2b2a" font-size="11" font-weight="600">${esc(leaf.topic)}</text><text x="${xTopic + 12}" y="${leaf.y + 12}" fill="#7a8783" font-size="9">${leaf.count ? `${leaf.count} 道 · 未掌握 ${leaf.un}` : '暂无错题'}${leaf.typeText ? ' · ' + esc(leaf.typeText) : ''}</text></g>`);
    }
  }

  return `<div class="mindmap-scroll"><svg class="mindmap-svg" viewBox="0 0 760 ${height}" width="760" height="${height}" role="img" aria-label="${esc(subject)}知识框架思维导图"><rect width="760" height="${height}" fill="#fdfaf3"/>${paths.join('')}${groups.join('')}</svg></div>`;
}

function openMindMap() {
  const subjects = Object.keys(SYLLABUS);
  const initial = state.filters.subject !== 'all' && subjects.includes(state.filters.subject) ? state.filters.subject : subjects[0];
  openModal(`<div class="modal-head"><div><div class="modal-kicker">MIND MAP</div><h2 class="modal-title">知识框架思维导图</h2><p class="modal-sub">科目 → 章节 → 知识点 → 题型；点知识点跳到错题本。</p></div><button class="icon-btn" data-action="close-modal" aria-label="关闭">${icon('x')}</button></div>
  <div class="modal-body"><div class="mindmap-toolbar"><label>科目 <select class="select input" id="mindmapSubject">${subjects.map((s) => `<option value="${esc(s)}" ${s === initial ? 'selected' : ''}>${esc(s)}</option>`).join('')}</select></label><span class="muted" style="font-size:10px">红色边 = 有未掌握</span></div><div id="mindmapCanvas">${mindSvg(initial)}</div></div>
  <div class="modal-foot"><span class="muted" style="font-size:10px">点知识点 → 按该知识点筛选错题</span><div class="foot-right"><button class="btn btn-primary" data-action="close-modal">关闭</button></div></div>`, false);
  setTimeout(() => {
    const sel = $('#mindmapSubject');
    if (sel) sel.addEventListener('change', () => { const c = $('#mindmapCanvas'); if (c) c.innerHTML = mindSvg(sel.value); });
  }, 30);
}

document.addEventListener('click', (event) => {
  const el = event.target.closest('[data-syllabus-action="mindmap"]');
  if (el) { event.preventDefault(); openMindMap(); }
});

/* ============================================================
   错题拾遗 · AI 错题教练（DeepSeek API）
   Key 只保存在本机浏览器；不写进 GitHub Pages。
   文字题直接分析；图片题需要先把题干补成文字。
   ============================================================ */
'use strict';

const AI_KEY = 'cuoti_ai_key_v1';
const AI_URL = 'https://api.deepseek.com/chat/completions';
const AI_MODEL = 'deepseek-chat';
const AI_MAX_CHARS = 5000;
const AI_CACHE_KEY = 'cuoti_ai_cache_v1';
const AI_HINT_KEY = 'cuoti_ai_hint_v1';

let aiKeyValue = safeGet(AI_KEY) || '';
let aiHintMode = safeGet(AI_HINT_KEY) !== '0';
let aiBusy = false;
let aiCache = {};
try { aiCache = JSON.parse(safeGet(AI_CACHE_KEY) || '{}') || {}; } catch { aiCache = {}; }
let lastAnalysis = null;
let lastSimilar = null;
let lastSimilarSource = null;

function aiFingerprint(q) {
  return [q.id, q.question, q.answer, q.myAnswer, q.reason, q.topic].join('|').slice(0, 4000);
}
function aiCacheGet(q, mode = 'full') {
  const item = aiCache[aiFingerprint(q) + '|' + mode];
  return item && item.result ? item : null;
}
function aiCacheSet(q, result, mode = 'full') {
  aiCache[aiFingerprint(q) + '|' + mode] = { result, at: new Date().toISOString() };
  const keys = Object.keys(aiCache);
  if (keys.length > 120) {
    keys.sort((a, b) => String(aiCache[a].at || '').localeCompare(String(aiCache[b].at || '')));
    for (const k of keys.slice(0, keys.length - 120)) delete aiCache[k];
  }
  safeSet(AI_CACHE_KEY, JSON.stringify(aiCache));
}

function aiConfigured() { return Boolean(aiKeyValue); }

async function callDeepSeek(messages, maxTokens = 1400, json = true) {
  if (!aiKeyValue) throw new Error('还没有填写 DeepSeek API Key');
  const makeBody = (jsonMode) => {
    const body = {
      model: AI_MODEL,
      messages,
      temperature: 0.35,
      max_tokens: maxTokens
    };
    if (jsonMode) body.response_format = { type: 'json_object' };
    return body;
  };
  const send = (jsonMode) => fetch(AI_URL, {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json',
      Authorization: 'Bearer ' + aiKeyValue
    },
    body: JSON.stringify(makeBody(jsonMode))
  });
  let res = await send(json);
  let data = await res.json().catch(() => ({}));
  // 个别账号/模型不支持 JSON mode 时，退回普通文本，再按 JSON 解析。
  if (!res.ok && res.status === 400 && json) {
    res = await send(false);
    data = await res.json().catch(() => ({}));
  }
  if (!res.ok) {
    const msg = data.error?.message || data.message || '';
    if (res.status === 401) throw new Error('API Key 无效');
    if (res.status === 402) throw new Error('DeepSeek 余额不足，请充值');
    if (res.status === 429) throw new Error('请求太频繁，稍后再试');
    throw new Error(msg || `DeepSeek 返回 ${res.status}`);
  }
  return data.choices?.[0]?.message?.content || '';
}

function parseAIJson(text) {
  let s = String(text || '').trim();
  s = s.replace(/^```(?:json)?\s*/i, '').replace(/\s*```$/i, '');
  try { return JSON.parse(s); } catch {}
  const a = s.indexOf('{');
  const b = s.lastIndexOf('}');
  if (a >= 0 && b > a) {
    try { return JSON.parse(s.slice(a, b + 1)); } catch {}
  }
  return null;
}

function qText(q) {
  const parts = [
    '学科：' + q.subject,
    '章节：' + (q.chapter || '未填写'),
    '知识点：' + (q.topic || '未填写'),
    '具体考题项目：' + (q.item || '未填写'),
    '题型：' + (q.type || '未填写'),
    '难度：' + '★'.repeat(q.difficulty || 3),
    '错因：' + (q.reason || '未填写'),
    '题干：' + (q.question || ''),
    '我的答案/思路：' + (q.myAnswer || '未填写'),
    '正确答案：' + (q.answer || '未填写'),
    '我的解析：' + (q.analysis || '未填写')
  ];
  return parts.join('\n').slice(0, AI_MAX_CHARS);
}

async function aiAnalyze(id, force = false, full = false) {
  const q = state.questions.find((x) => x.id === id);
  if (!q) return;
  if (!aiConfigured()) return aiNeedKey();
  if (!q.question && !q.images.length) return toast('这道题没有文字题干', 'info');
  if (!q.question) return toast('图片题请先在“编辑”里补一句题干，AI 才能分析', 'info');
  const hintOnly = aiHintMode && !full;
  const mode = hintOnly ? 'hint' : 'full';
  if (!force) {
    const cached = aiCacheGet(q, mode);
    if (cached) return hintOnly ? renderHintResult(q, cached.result, true) : renderAnalyzeResult(q, cached.result, true);
  }
  if (aiBusy) return;
  aiBusy = true;
  aiLoading(hintOnly ? '正在给提示' : '正在分析错题', hintOnly ? '只给下一步，不直接给答案…' : '读懂题干和你的答案，定位考点与错因…');
  try {
    const prompt = hintOnly
      ? `请分析下面这道考研错题，但只给提示，不要给出最终答案或完整解法。输出 JSON：\n{"考点":"一句话","错因":"一句话，指出卡在哪","提示":["第一步做什么","关键公式/定理"],"易错点":["..."],"下一步":"一句可执行的话"}\n\n${qText(q)}`
      : `请分析下面这道考研错题。输出 JSON，字段固定为：\n{"考点":"一句话","错因":"一句话，指出具体哪一步错了","正确思路":["步骤1","步骤2"],"易错点":["..."],"下次建议":"一句可执行的话"}\n\n${qText(q)}`;
    const content = await callDeepSeek([
      { role: 'system', content: hintOnly ? '你是考研错题教练。先引导学生自己走一步，不直接给最终答案。只输出一个 JSON 对象，不要 markdown。' : '你是考研错题教练。回答务实、具体、不空泛。只输出一个 JSON 对象，不要 markdown。' },
      { role: 'user', content: prompt }
    ], hintOnly ? 800 : 1300, true);
    const r = parseAIJson(content);
    if (!r) throw new Error('AI 返回格式异常，请再试一次');
    aiCacheSet(q, r, mode);
    if (hintOnly) renderHintResult(q, r, false);
    else renderAnalyzeResult(q, r, false);
  } catch (error) {
    aiErrorModal(error);
  } finally {
    aiBusy = false;
  }
}

function weaknessCard() {
  const active = state.questions.filter((q) => q.status !== 'mastered');
  const topics = {};
  for (const q of active) {
    const t = q.topic || '未填知识点';
    topics[t] = (topics[t] || 0) + 1;
  }
  const topTopics = Object.entries(topics).sort((a, b) => b[1] - a[1]).slice(0, 4);
  const maxT = Math.max(1, ...topTopics.map((x) => x[1]));
  const start = new Date(Date.now() - 6 * 86400000).toISOString().slice(0, 10);
  const qmap = new Map(state.questions.map((q) => [q.id, q]));
  const weakReasons = {};
  for (const l of state.logs) {
    if ((l.date || '') < start || Number(l.rating) > 2) continue;
    const q = qmap.get(l.qid);

    </div>

      <div class="reason-list">${topReasons.length ? topReasons.map(([n, v]) => `<div class="reason-row"><span class="reason-name">${esc(n)}</span><span class="reason-track"><span class="reason-fill" style="width:${Math.round(v / maxR * 100)}%"></span></span><span class="reason-num">${v}</span></div>`).join('') : '<div class="empty-mini">近 7 天还没有低分复习记录。</div>'}</div>

  <script>
/* ============================================================
   错题拾遗 · 备份
   - 本地自动快照：防误删/误导入，保留最近 3 份
   - 电脑 Chrome/Edge：可授权自动写入一个备份文件
   - 手机浏览器不允许静默写文件，仍以提醒 + 手动导出为主
   ============================================================ */
'use strict';

const BACKUP_KEY = 'cuoti_last_backup_v1';
const BACKUP_SNOOZE_KEY = 'cuoti_backup_snooze_v1';
const SNAP_DB = 'cuoti_snapshot_db_v1';
const SNAP_STORE = 'snapshots';
const FS_DB = 'cuoti_backup_fs_v1';
const FS_STORE = 'handle';
const SNAP_FALLBACK_KEY = 'cuoti_snapshot_fallback_v1';

let lastSnapshotAt = null;
let lastSnapshotHash = '';
let snapshotTimer = null;
let autoBackupHandle = null;
let autoBackupTimer = null;
let autoBackupAt = null;

function backupDate() {
  const v = safeGet(BACKUP_KEY);
  return v ? new Date(v) : null;
}
function backupDays() {
  const d = backupDate();
  if (!d) return null;
  return Math.floor((Date.now() - d.getTime()) / 86400000);
}
function markBackup() {
  safeSet(BACKUP_KEY, new Date().toISOString());
  const banner = $('#backupBanner');
  if (banner) banner.remove();
  render();
}

function openDb(name, storeName) {
  return new Promise((resolve, reject) => {
    let done = false;
    const timer = setTimeout(() => {
      if (done) return;
      done = true;
      reject(new Error('IndexedDB 超时'));
    }, 1500);
    const req = indexedDB.open(name, 1);
    req.onupgradeneeded = () => {
      const db = req.result;
      if (!db.objectStoreNames.contains(storeName)) db.createObjectStore(storeName, { keyPath: 'id', autoIncrement: true });
    };
    req.onsuccess = () => {
      if (done) return;
      done = true;
      clearTimeout(timer);
      resolve(req.result);
    };
    req.onerror = () => {
      if (done) return;
      done = true;
      clearTimeout(timer);
      reject(req.error);
    };
    req.onblocked = () => {
      if (done) return;
      done = true;
      clearTimeout(timer);
      reject(new Error('IndexedDB 被阻塞'));
    };
  });
}
async function idbAll(db, store) {
  return new Promise((resolve, reject) => {
    const tx = db.transaction(store, 'readonly');
    const req = tx.objectStore(store).getAll();
    req.onsuccess = () => resolve(req.result || []);
    req.onerror = () => reject(req.error);
  });
}
async function idbAdd(db, store, value) {
  return new Promise((resolve, reject) => {
    const tx = db.transaction(store, 'readwrite');
    tx.objectStore(store).add(value);
    tx.oncomplete = () => resolve();
    tx.onerror = () => reject(tx.error);
  });
}
async function idbDelete(db, store, key) {
  return new Promise((resolve, reject) => {
    const tx = db.transaction(store, 'readwrite');
    tx.objectStore(store).delete(key);
    tx.oncomplete = () => resolve();
    tx.onerror = () => reject(tx.error);
  });
}
async function idbPut(db, store, value) {
  return new Promise((resolve, reject) => {
    const tx = db.transaction(store, 'readwrite');
    tx.objectStore(store).put(value);
    tx.oncomplete = () => resolve();
    tx.onerror = () => reject(tx.error);
  });
}

function dataSnapshot() {
  return {
    at: new Date().toISOString(),
    questions: state.questions,
    logs: state.logs,
    profile: typeof kyProfile === 'object' ? kyProfile : {},
    profileUpdatedAt: safeGet('cuoti_ky_profile_ts_v1') || null
  };
}
function snapshotHash() {
  const q = state.questions.map((x) => x.id + ':' + x.updatedAt).join('|');
  const l = state.logs.length + ':' + (state.logs[state.logs.length - 1]?.at || '');
  return state.questions.length + '|' + q + '|' + l;
}

async function saveSnapshot(force = false) {
  if (!state.questions.length) return;
  const hash = snapshotHash();
  if (!force && hash === lastSnapshotHash) return;
  try {
    const db = await openDb(SNAP_DB, SNAP_STORE);
    await idbAdd(db, SNAP_STORE, dataSnapshot());
    const all = await idbAll(db, SNAP_STORE);
    all.sort((a, b) => String(a.at).localeCompare(String(b.at)));
    while (all.length > 3) {
      const old = all.shift();
      await idbDelete(db, SNAP_STORE, old.id);
    }
  } catch (e) {
    // 某些浏览器/隐私模式没有 IndexedDB，退回 localStorage 只保留一份。
    try { safeSet(SNAP_FALLBACK_KEY, JSON.stringify(dataSnapshot())); } catch {}
  }
  lastSnapshotHash = hash;
  lastSnapshotAt = new Date().toISOString();
  const el = $('#snapshotStatus');
  if (el) el.textContent = '最近快照：' + fmtDateTime(lastSnapshotAt);
}

async function latestSnapshot() {
  try {
    const db = await openDb(SNAP_DB, SNAP_STORE);
    const all = await idbAll(db, SNAP_STORE);
    all.sort((a, b) => String(a.at).localeCompare(String(b.at)));
    if (all.length) {
      lastSnapshotAt = all[all.length - 1].at;
      return all[all.length - 1];
    }
  } catch {}
  try {
    const raw = safeGet(SNAP_FALLBACK_KEY);
    if (raw) {
      const snap = JSON.parse(raw);
      lastSnapshotAt = snap.at || null;
      return snap;
    }
  } catch {}
  return null;
}

async function restoreLatestSnapshot() {
  const snap = await latestSnapshot();
  if (!snap) return toast('还没有可恢复的快照', 'error');
  if (!confirm(`恢复 ${fmtDateTime(snap.at)} 的快照？\n当前未保存的修改会被覆盖，建议先导出当前数据。`)) return;
  try {
    const qs = Array.isArray(snap.questions) ? snap.questions.map(normalize) : [];
    await Store.bulk(qs);
    state.questions = qs;
    state.logs = Array.isArray(snap.logs) ? snap.logs : [];
    saveLogs();
    if (snap.profile && typeof snap.profile === 'object') {
      kyProfile = { ...kyProfile, ...snap.profile };
      safeSet(KY_KEY, JSON.stringify(kyProfile));
      if (snap.profileUpdatedAt) safeSet('cuoti_ky_profile_ts_v1', snap.profileUpdatedAt);
    }
    toast('快照已恢复，正在刷新…');
    setTimeout(() => location.reload(), 500);
  } catch (e) {
    toast('恢复失败：' + (e.message || ''), 'error');
  }
}

/* ---------- 电脑端自动写入文件 ---------- */
function supportsFileBackup() {
  return typeof window.showSaveFilePicker === 'function';
}
async function loadAutoHandle() {
  if (!supportsFileBackup()) return;
  try {
    const db = await openDb(FS_DB, FS_STORE);
    const all = await idbAll(db, FS_STORE);
    const item = all.find((x) => x.id === 'auto' || x.key === 'auto');
    if (item && item.handle) {
      autoBackupHandle = item.handle;
      const perm = await autoBackupHandle.queryPermission({ mode: 'readwrite' });
      if (perm === 'granted') autoBackupAt = '已授权';
      else autoBackupAt = '需要重新授权';
    }
  } catch {}
}
async function saveAutoHandle(handle) {
  const db = await openDb(FS_DB, FS_STORE);
  await idbPut(db, FS_STORE, { id: 'auto', handle });
}
async function enableFileBackup() {
  if (!supportsFileBackup()) return toast('这个浏览器不支持自动写文件，请用导出备份', 'error');
  try {
    const handle = await window.showSaveFilePicker({
      suggestedName: '错题拾遗-自动备份.json',
      types: [{ description: 'JSON 备份', accept: { 'application/json': ['.json'] } }]
    });
    const perm = await handle.requestPermission({ mode: 'readwrite' });
    if (perm !== 'granted') return toast('没有获得文件写入权限', 'error');
    autoBackupHandle = handle;
    autoBackupAt = '已授权';
    await saveAutoHandle(handle);
    await writeAutoBackup();
    render();
    toast('自动备份已开启，之后修改会自动写入这个文件');
  } catch (e) {
    if (e.name !== 'AbortError') toast('开启失败：' + (e.message || ''), 'error');
  }
}
async function writeAutoBackup() {
  if (!autoBackupHandle) return;
  try {
    const perm = await autoBackupHandle.queryPermission({ mode: 'readwrite' });
    if (perm !== 'granted') { autoBackupAt = '需要重新授权'; return; }
    const writable = await autoBackupHandle.createWritable();
    await writable.write(JSON.stringify({ ...dataSnapshot(), app: '错题拾遗', version: APP_VERSION }, null, 2));
    await writable.close();
    autoBackupAt = '已自动写入';
    safeSet(BACKUP_KEY, new Date().toISOString());
    const el = $('#autoBackupStatus');
    if (el) el.textContent = '自动备份：' + fmtDateTime(new Date().toISOString());
  } catch (e) {
    autoBackupAt = '写入失败';
    console.warn('自动备份失败', e);
  }
}
function scheduleAutoBackup() {
  if (!autoBackupHandle) return;
  clearTimeout(autoBackupTimer);
  autoBackupTimer = setTimeout(writeAutoBackup, 3500);
}

const baseExportJSONBackup = exportJSON;
exportJSON = function () {
  baseExportJSONBackup();
  markBackup();
  toast('已导出备份，建议把文件放到网盘或发给自己');
};

function backupCard() {
  const days = backupDays();
  const text = days === null ? '还没有导出过备份' : days === 0 ? '今天导出过' : `${days} 天前导出过`;
  const snapText = lastSnapshotAt ? fmtDateTime(lastSnapshotAt) : '还没有快照';
  const fileText = !supportsFileBackup() ? '手机浏览器不支持，请用个人同步或手动导出' : autoBackupHandle ? (autoBackupAt || '已授权') : '未开启（仅电脑 Chrome/Edge）';
  return `<div class="card settings-card"><h3>${icon('download')}备份与恢复</h3><p>数据可能因清理缓存、换设备而丢失。建议每周导出一次 JSON。</p>
    <div class="sync-status"><span class="sync-dot ${days === null || days > 7 ? 'err' : 'on'}"></span><strong>${esc(text)}</strong><span>${state.questions.length} 道错题</span></div>
    <div class="sync-status"><span class="sync-dot on"></span><strong>自动快照</strong><span id="snapshotStatus">最近快照：${esc(snapText)}</span></div>
    <div class="sync-status"><span class="sync-dot ${autoBackupHandle ? 'on' : ''}"></span><strong>自动备份文件</strong><span id="autoBackupStatus">${esc(fileText)}</span></div>
    <div class="setting-actions"><button class="btn btn-primary" data-backup-action="now">${icon('download')}立即导出备份</button><button class="btn btn-ghost" data-backup-action="snapshot">${icon('refresh')}立即快照</button><button class="btn btn-ghost" data-backup-action="restore">${icon('upload')}恢复快照</button></div>
    ${supportsFileBackup() ? `<div class="setting-actions"><button class="btn btn-ghost btn-sm" data-backup-action="enable-file">${icon('download')}${autoBackupHandle ? '重新授权自动备份' : '开启自动备份到文件'}</button></div>` : ''}
    <div class="sync-install-tip">快照保存在本机，防误删/误导入，但不能防“清理浏览器数据”。真正换设备请用导出 JSON 或个人同步。</div>
  </div>`;
}
const baseSettingsBackup = renderSettings;
renderSettings = function () {
  return baseSettingsBackup().replace('<div class="settings-grid">', `<div class="settings-grid">${backupCard()}`);
};

function showBackupBanner() {
  if ($('#backupBanner') || !state.questions.length) return;
  const days = backupDays();
  if (days !== null && days <= 7) return;
  if (safeGet(BACKUP_SNOOZE_KEY) === today()) return;
  const div = document.createElement('div');
  div.id = 'backupBanner';
  div.style.cssText = 'position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:85;max-width:min(92vw,560px);background:#172522;color:#f4efe7;border:1px solid rgba(255,255,255,.16);border-radius:14px;padding:13px 16px;box-shadow:0 16px 40px rgba(0,0,0,.25);display:flex;gap:12px;align-items:center;font-size:13px;line-height:1.5';
  div.innerHTML = `<div style="flex:1"><strong>该备份了</strong><br><span style="opacity:.78">${days === null ? '还没有导出过备份。' : `上次备份是 ${days} 天前。`}清理浏览器数据会丢失错题。</span></div><button class="btn btn-primary btn-sm" data-backup-action="now">立即备份</button><button class="btn btn-ghost btn-sm" data-backup-action="later" style="color:#f4efe7;border-color:rgba(255,255,255,.25)">稍后</button>`;
  document.body.appendChild(div);
}

document.addEventListener('click', (event) => {
  const el = event.target.closest('[data-backup-action]');
  if (!el) return;
  event.preventDefault();
  const action = el.dataset.backupAction;
  if (action === 'now') exportJSON();
  if (action === 'later') {
    safeSet(BACKUP_SNOOZE_KEY, today());
    const b = $('#backupBanner');
    if (b) b.remove();
    toast('已稍后提醒，建议今天内备份');
  }
  if (action === 'snapshot') saveSnapshot(true).then(() => toast('快照已保存'));
  if (action === 'restore') restoreLatestSnapshot();
  if (action === 'enable-file') enableFileBackup();
});

async function initBackup() {
  await latestSnapshot();
  await loadAutoHandle();
  setTimeout(showBackupBanner, 1600);
  setTimeout(() => saveSnapshot(false), 4000);
  snapshotTimer = setInterval(() => {
    saveSnapshot(false);
    scheduleAutoBackup();
  }, 30000);
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'hidden') {
      saveSnapshot(false);
      scheduleAutoBackup();
    }
  });
}
function bootBackup(tries = 0) {
  if (window.__CUOTI_READY__) { initBackup(); return; }
  if (tries < 100) setTimeout(() => bootBackup(tries + 1), 150);
}
document.addEventListener('DOMContentLoaded', () => setTimeout(() => bootBackup(), 300));

/* ============================================================
   错题拾遗 · 图片识题（可选，阿里云百炼 Qwen-VL）

'use strict';

const VISION_KEY = 'cuoti_vision_key_v1';
const VISION_URL = 'https://dashscope.aliyuncs.com/compatible-mode/v1/chat/completions';
const VISION_MODEL = 'qwen-vl-plus';

let visionKeyValue = safeGet(VISION_KEY) || '';

let liveStream = null;

function visionConfigured() { return Boolean(visionKeyValue); }

async function callVision(dataUrl) {
  if (!visionKeyValue) throw new Error('还没有填写百炼 API Key');
  const res = await fetch(VISION_URL, {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json',
      Authorization: 'Bearer ' + visionKeyValue
    },
    body: JSON.stringify({
      model: VISION_MODEL,
      temperature: 0.1,
      max_tokens: 1400,
      messages: [{
        role: 'user',
        content: [
          { type: 'image_url', image_url: { url: dataUrl } },
          { type: 'text', text: '请提取这张图片里的题目文字，保留题号、选项和数学公式（公式用 LaTeX），不要解答，不要解释，只输出题目原文。' }
        ]
      }]

  const data = await res.json().catch(() => ({}));
  if (!res.ok) {
    const msg = data.error?.message || data.message || '';
    if (res.status === 401) throw new Error('百炼 API Key 无效');
    if (res.status === 429) throw new Error('请求太频繁，稍后再试');
    throw new Error(msg || `百炼返回 ${res.status}`);
  }
  const content = data.choices?.[0]?.message?.content;
  if (Array.isArray(content)) return content.map((x) => x.text || '').join('\n').trim();
  return String(content || '').trim();
}

function cropImageFile(file) {
  return new Promise((resolve) => {
    const url = URL.createObjectURL(file);
    const overlay = document.createElement('div');
    overlay.className = 'crop-overlay';
    overlay.innerHTML = `<div class="crop-title">拖动方框，框住题目区域；拖四角可以缩放</div>
      <div class="crop-stage" id="cropStage">
        <img id="cropImg" src="${url}" alt="待框选的题目照片">
        <div class="crop-box" id="cropBox">
          <span class="crop-handle" data-handle="nw"></span>
          <span class="crop-handle" data-handle="ne"></span>
          <span class="crop-handle" data-handle="sw"></span>
          <span class="crop-handle" data-handle="se"></span>
        </div>
      </div>
      <div class="crop-actions">
        <button type="button" class="btn btn-ghost" data-crop-action="cancel">取消</button>
        <button type="button" class="btn btn-ghost" data-crop-action="skip">整张使用</button>
        <button type="button" class="btn btn-primary" data-crop-action="confirm">${icon('check')}使用框选区域</button>
      </div>`;
    document.body.appendChild(overlay);
    const prevOverflow = document.body.style.overflow;
    document.body.style.overflow = 'hidden';

    const stage = $('#cropStage');
    const img = $('#cropImg');
    const box = $('#cropBox');
    let drag = null;

    const close = (result) => {
      if (overlay.parentNode) overlay.remove();
      URL.revokeObjectURL(url);
      document.body.style.overflow = prevOverflow;
      resolve(result);
    };

    const initBox = () => {
      if (!img.clientWidth) return;
      const w = img.clientWidth;
      const h = img.clientHeight;
      box.style.left = Math.round(w * .08) + 'px';
      box.style.top = Math.round(h * .08) + 'px';
      box.style.width = Math.round(w * .84) + 'px';
      box.style.height = Math.round(h * .84) + 'px';
    };
    if (img.complete && img.naturalWidth) setTimeout(initBox, 0);
    else img.addEventListener('load', () => setTimeout(initBox, 0), { once: true });

    const clamp = (v, min, max) => Math.max(min, Math.min(max, v));
    const geo = () => {
      const s = stage.getBoundingClientRect();
      return { s, w: s.width, h: s.height };
    };

    const onDown = (event) => {
      if (!event.target.closest('#cropBox')) return;
      event.preventDefault();
      const r = box.getBoundingClientRect();
      const g = geo();
      drag = {
        handle: event.target.dataset.handle || 'move',
        startX: event.clientX,
        startY: event.clientY,
        left: r.left - g.s.left,
        top: r.top - g.s.top,
        right: r.right - g.s.left,
        bottom: r.bottom - g.s.top,
      };
      try { box.setPointerCapture(event.pointerId); } catch (e) {}
    };

    const onMove = (event) => {
      if (!drag) return;
      event.preventDefault();
      const g = geo();
      let dx = event.clientX - drag.startX;
      let dy = event.clientY - drag.startY;
      let left = drag.left;
      let top = drag.top;
      let right = drag.right;
      let bottom = drag.bottom;

      if (drag.handle === 'move') {
        left = clamp(left + dx, 0, g.w - (right - left));
        top = clamp(top + dy, 0, g.h - (bottom - top));
        right = left + (drag.right - drag.left);
        bottom = top + (drag.bottom - drag.top);
      } else {
        if (drag.handle.includes('w')) left = clamp(drag.left + dx, 0, drag.right - 60);
        if (drag.handle.includes('e')) right = clamp(drag.right + dx, drag.left + 60, g.w);
        if (drag.handle.includes('n')) top = clamp(drag.top + dy, 0, drag.bottom - 60);
        if (drag.handle.includes('s')) bottom = clamp(drag.bottom + dy, drag.top + 60, g.h);
      }

      box.style.left = left + 'px';
      box.style.top = top + 'px';
      box.style.width = Math.max(60, right - left) + 'px';
      box.style.height = Math.max(60, bottom - top) + 'px';
    };

    const onUp = () => { drag = null; };

    box.addEventListener('pointerdown', onDown);
    document.addEventListener('pointermove', onMove, { passive: false });
    document.addEventListener('pointerup', onUp);
    document.addEventListener('pointercancel', onUp);

    const cleanup = () => {
      document.removeEventListener('pointermove', onMove);
      document.removeEventListener('pointerup', onUp);
      document.removeEventListener('pointercancel', onUp);
    };

    overlay.addEventListener('click', async (event) => {
      const btn = event.target.closest('[data-crop-action]');
      if (!btn) return;
      const action = btn.dataset.cropAction;
      if (action === 'cancel') { cleanup(); close(null); return; }
      if (action === 'skip') { cleanup(); close(file); return; }
      if (action !== 'confirm') return;
      if (!img.naturalWidth) { toast('图片还没加载好', 'info'); return; }
      try {
        const ir = img.getBoundingClientRect();
        const br = box.getBoundingClientRect();
        const sx = Math.max(0, (br.left - ir.left) / ir.width * img.naturalWidth);
        const sy = Math.max(0, (br.top - ir.top) / ir.height * img.naturalHeight);
        const sw = Math.max(1, br.width / ir.width * img.naturalWidth);
        const sh = Math.max(1, br.height / ir.height * img.naturalHeight);
        const canvas = document.createElement('canvas');
        canvas.width = Math.max(1, Math.round(sw));
        canvas.height = Math.max(1, Math.round(sh));
        canvas.getContext('2d').drawImage(img, sx, sy, sw, sh, 0, 0, canvas.width, canvas.height);
        const blob = await new Promise((r) => canvas.toBlob(r, 'image/jpeg', .92));
        cleanup();
        if (!blob) { close(file); return; }
        close(new File([blob], `crop-${Date.now()}.jpg`, { type: 'image/jpeg' }));
      } catch (e) {
        cleanup();
        close(file);
      }
    });
  });
}

async function addImagesFromFiles(files) {
  const list = [...files].filter((f) => f.type && f.type.startsWith('image/'));
  if (!list.length) return;
  for (const file of list) {
    const result = typeof cropImageFile === 'function' ? await cropImageFile(file) : file;
    if (!result) continue;
    await addImages([result]);
  }
}
async function captureLiveCamera() {
  const video = $('#liveVideo');
  if (!video || !video.videoWidth) return toast('相机还没准备好，再等一下', 'info');
  const canvas = document.createElement('canvas');
  const max = 1400;
  const k = Math.min(1, max / Math.max(video.videoWidth, video.videoHeight));
  canvas.width = Math.round(video.videoWidth * k);
  canvas.height = Math.round(video.videoHeight * k);
  canvas.getContext('2d').drawImage(video, 0, 0, canvas.width, canvas.height);
  const blob = await new Promise((r) => canvas.toBlob(r, 'image/jpeg', 0.9));
  if (!blob) return toast('拍照失败，再试一次', 'error');
  const file = new File([blob], `camera-${Date.now()}.jpg`, { type: 'image/jpeg' });
  stopLiveCamera();
  const cropped = await cropImageFile(file);
  if (cropped) await addImages([cropped]);
}

  <script>
/* ============================================================
   错题拾遗 · AI 自动识别知识点
   保存新错题时，按考研大纲自动填学科/章节/知识点/错因。
   ============================================================ */
'use strict';

const AUTOTAG_KEY = 'cuoti_ai_autotag_v1';
const AUTOTAG_CACHE_KEY = 'cuoti_ai_tag_cache_v1';

let autotagBusy = false;
let autotagCache = {};
try { autotagCache = JSON.parse(safeGet(AUTOTAG_CACHE_KEY) || '{}') || {}; } catch { autotagCache = {}; }

function autoTagEnabled() { return safeGet(AUTOTAG_KEY) !== '0'; }
function autoTagShould(old) {
  if (!aiConfigured() || !autoTagEnabled() || autotagBusy) return false;
  if (old && (old.topic || old.chapter)) return false;
  const topic = $('#qTopic');
  const q = $('#qQuestion');
  if (topic && topic.value.trim()) return false;
  return Boolean(q && q.value.trim());
}

function syllabusPrompt() {
  return Object.entries(SYLLABUS).map(([subject, chapters]) =>
    subject + '：' + Object.entries(chapters).map(([ch, pts]) => `${ch}（${pts.join('、')}）`).join('；')
  ).join('\n');
}

async function classifyQuestion(text) {
  const key = 'q:' + String(text).slice(0, 1800);
  if (autotagCache[key]) return autotagCache[key];
  const content = await callDeepSeek([
    { role: 'system', content: '你是考研错题分类器。只能从给定大纲中选择，不要编造章节。只输出 JSON，不要 markdown。' },
    { role: 'user', content: `请根据题目选择最合适的学科、章节、知识点、具体考题项目和错因。\nitem 必须是该知识点下具体的考题项目（例如：求极限、无穷小阶的比较、间断点类型判断），不要只写选择题/解答题。\n输出 JSON：\n{"subject":"学科","chapter":"章节","topic":"知识点","type":"选择题/填空题/解答题等","item":"具体考题项目","reason":"错因","tags":["标签1","标签2"]}\n\n可选大纲：\n${syllabusPrompt()}\n\n可选题型：${TYPES.join('、')}\n可选错因：${REASONS.join('、')}\n\n题目：\n${String(text).slice(0, 4000)}` }
  ], 500, true);
  const r = parseAIJson(content);
  if (!r) throw new Error('AI 没有返回分类结果');
  const result = {
    subject: SUBJECTS.includes(r.subject) ? r.subject : '',
    chapter: String(r.chapter || '').trim(),
    topic: String(r.topic || '').trim(),
    type: TYPES.includes(r.type) ? r.type : '',
    item: String(r.item || '').trim(),
    reason: REASONS.includes(r.reason) ? r.reason : '',
    tags: Array.isArray(r.tags) ? r.tags.map((x) => String(x).trim()).filter(Boolean).slice(0, 6) : []
  };
  autotagCache[key] = result;
  const keys = Object.keys(autotagCache);
  if (keys.length > 120) for (const k of keys.slice(0, keys.length - 120)) delete autotagCache[k];
  try { safeSet(AUTOTAG_CACHE_KEY, JSON.stringify(autotagCache)); } catch {}
  return result;
}

function fillClassification(r) {
  if (!r) return;
  const sub = $('#qSubject');
  if (r.subject && sub && r.subject !== sub.value) {
    sub.value = r.subject;
    sub.dispatchEvent(new Event('change'));
  }
  const chapter = $('#sylChapter');
  const point = $('#sylPoint');
  const hidden = $('#qChapter');
  if (r.chapter && chapter) {
    const has = [...chapter.options].some((o) => o.value === r.chapter);
    if (has) {
      chapter.value = r.chapter;
      chapter.dispatchEvent(new Event('change'));
      if (r.topic && point && [...point.options].some((o) => o.value === r.topic)) {
        point.value = r.topic;
        point.dispatchEvent(new Event('change'));
      }
    }
  }
  if (r.topic) {
    const topic = $('#qTopic');
    if (topic) topic.value = r.topic;
  }
  if (hidden) hidden.value = r.chapter || hidden.value;
  const type = $('#qType');
  if (r.type && type && [...type.options].some((o) => o.value === r.type)) type.value = r.type;
  const item = $('#qItem');
  if (item && r.item) item.value = r.item;
  const reason = $('#qReason');
  if (r.reason && reason && [...reason.options].some((o) => o.value === r.reason)) reason.value = r.reason;
  const tags = $('#qTags');
  if (tags && r.tags && r.tags.length) tags.value = r.tags.join(', ');

const KATEX_CSS = [
  `https://cdn.jsdelivr.net/npm/katex@${KATEX_VERSION}/dist/katex.min.css`,

];
const KATEX_AUTO = [
  `https://cdn.jsdelivr.net/npm/katex@${KATEX_VERSION}/dist/contrib/auto-render.min.js`,
  `https://unpkg.com/katex@${KATEX_VERSION}/dist/contrib/auto-render.min.js`
];

let mathReady = false;

function addCss(href) {
  const link = document.createElement('link');
  link.rel = 'stylesheet';
  link.href = href;
  document.head.appendChild(link);
}
function loadScript(urls, index = 0) {
  return new Promise((resolve, reject) => {
    if (index >= urls.length) return reject(new Error('KaTeX 加载失败'));
    const s = document.createElement('script');
    s.src = urls[index];
    s.onload = resolve;
    s.onerror = () => loadScript(urls, index + 1).then(resolve, reject);

          { left: '$$', right: '$$', display: true },
          { left: '\\[', right: '\\]', display: true },
          { left: '$', right: '$', display: false },
          { left: '\\(', right: '\\)', display: false }
        ],
        throwOnError: false,
        strict: false,
        ignoredTags: ['script', 'noscript', 'style', 'textarea', 'pre', 'code'],
        ignoredClasses: ['katex', 'katex-display']
      });
    } catch (e) { console.warn('公式渲染失败', e); }
  }, 120);
}

};

    .then(() => loadScript(KATEX_AUTO))

    .catch(() => console.warn('KaTeX 未加载，公式将保留为文本'));

  setChatBusy(true);
  const box = $('#aiChatMessages');
  const loading = chatBubble('assistant', '正在结合你的错题数据思考…');
  loading.id = 'aiChatLoading';
  if (box) { box.appendChild(loading); chatScroll(); }
  try {
    const recent = chatHistory.slice(-12).map((m) => ({ role: m.role, content: m.content }));
    const answer = await callDeepSeek([
      { role: 'system', content: '你是考研学习助手，中文回答，务实、具体、不空泛。可以结合学生的错题数据，但不要编造数据。数学公式用 LaTeX（$...$）。回答控制在 300 字以内，必要时分点。' },
      { role: 'system', content: chatContext() },
      ...recent
    ], 1200, false);
    chatHistory.push({ role: 'assistant', content: answer || '我没有生成内容，请再问一次。' });
    saveChat();
    renderChatMessages();
  } catch (error) {
    const msg = error.message || '请求失败';
    chatHistory.push({ role: 'assistant', content: '请求失败：' + msg + '\n\n请检查 DeepSeek Key、余额和网络。' });
    saveChat();
    renderChatMessages();
  } finally {
    setChatBusy(false);
  }
}

function openChat() {
  if ($('#aiChatOverlay')) return;
  const overlay = document.createElement('div');
  overlay.id = 'aiChatOverlay';
  overlay.className = 'ai-chat-overlay';
  overlay.innerHTML = `<div class="ai-chat-panel" role="dialog" aria-label="AI 学习助手">
    <div class="ai-chat-head"><div><div class="ai-chat-kicker">AI COACH</div><h2>AI 学习助手</h2><p>会结合你的错题数据回答</p></div><div class="ai-chat-head-actions"><button type="button" class="btn btn-ghost btn-sm" data-chat-action="clear">清空</button><button type="button" class="btn btn-ghost btn-sm" data-chat-action="settings">去设置</button><button type="button" class="icon-btn" data-chat-action="close" aria-label="关闭">${icon('x')}</button></div></div>
    <div class="ai-chat-messages" id="aiChatMessages"></div>
    <div class="ai-chat-quick"><button type="button" data-chat-quick="分析一下我的薄弱点，并给出本周优先级">分析薄弱点</button><button type="button" data-chat-quick="根据我的错题，制定今天的学习计划">今日计划</button><button type="button" data-chat-quick="帮我总结最近最常见的错因，并给出改进方法">总结错因</button></div>
    <div class="ai-chat-input"><textarea id="aiChatInput" rows="2" placeholder="问一个学习问题…（Enter 发送，Shift+Enter 换行）"></textarea><button type="button" class="btn btn-primary" id="aiChatSend">发送</button></div>
    <div class="ai-chat-foot">AI 可能出错，答案请核对；对话只保存在本机。</div>
  </div>`;
  document.body.appendChild(overlay);
  document.body.classList.add('chat-open');
  renderChatMessages();
  const input = $('#aiChatInput');
  if (input) {
    input.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendChat(input.value); input.value = ''; }
    });
    setTimeout(() => input.focus(), 100);
  }
  const send = $('#aiChatSend');
  if (send) send.addEventListener('click', () => {
    const i = $('#aiChatInput');
    sendChat(i ? i.value : '');
    if (i) i.value = '';
  });
}

function closeChat() {
  const overlay = $('#aiChatOverlay');
  if (overlay) overlay.remove();
  document.body.classList.remove('chat-open');
}

function injectChatFab() {
  if ($('#aiChatFab')) return;
  const btn = document.createElement('button');
  btn.id = 'aiChatFab';
  btn.className = 'ai-chat-fab';
  btn.type = 'button';
  btn.innerHTML = `${icon('spark')}<span>AI 助手</span>`;
  btn.addEventListener('click', openChat);
  document.body.appendChild(btn);
}

document.addEventListener('click', (event) => {
  const open = event.target.closest('[data-chat-action="open"]');
  if (open) { event.preventDefault(); openChat(); return; }
  const el = event.target.closest('[data-chat-action], [data-chat-quick]');
  if (!el) return;
  if (el.dataset.chatQuick) { sendChat(el.dataset.chatQuick); return; }
  const action = el.dataset.chatAction;
  if (action === 'close') closeChat();
  if (action === 'settings') { closeChat(); navigate('settings'); }
  if (action === 'clear') {
    if (!confirm('清空本机的 AI 对话记录？')) return;
    chatHistory = [];
    saveChat();
    renderChatMessages();
  }
});

document.addEventListener('DOMContentLoaded', () => setTimeout(injectChatFab, 600));
window.addEventListener('pagehide', () => { if ($('#aiChatOverlay')) closeChat(); });

  <script>
/* ============================================================
   错题拾遗 · 配置向导 / 手机扫码配对 / 一键诊断
   ============================================================ */
'use strict';

const PAIR_FLAG = 'cuoti_pair_success_v1';

function b64urlEncode(s) {
  return btoa(s).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/g, '');
}
function b64urlDecode(s) {
  s = s.replace(/-/g, '+').replace(/_/g, '/');
  while (s.length % 4) s += '=';
  return atob(s);
}

/* 手机扫码打开后：写入 Gist 配置，去掉 hash，重载让同步模块接管 */
(function handlePairHash() {
  const raw = location.hash.replace(/^#/, '');
  if (!raw.startsWith('pair=')) return;
  try {
    const data = JSON.parse(b64urlDecode(raw.slice(5)));
    if (!data || !data.id || !data.token) throw new Error('配对内容不完整');
    safeSet('cuoti_gist_id_v1', String(data.id));
    safeSet('cuoti_gist_token_v1', String(data.token));
    try { sessionStorage.setItem(PAIR_FLAG, '1'); } catch {}
    history.replaceState({}, '', location.pathname + location.search);
    location.reload();
  } catch (e) {
    console.warn('配对失败', e);
    setTimeout(() => toast('扫码配对失败，请让电脑重新生成二维码', 'error'), 800);
  }
})();

function wizardConfigured() {
  return {
    ai: typeof aiConfigured === 'function' && aiConfigured(),
    sync: typeof gistConfigured === 'function' && gistConfigured(),
    backup: (typeof backupDays === 'function' && backupDays() !== null) || Boolean(typeof lastSnapshotAt !== 'undefined' && lastSnapshotAt)
  };
}

function wizardStep(num, title, desc, ok, action, actionText) {
  return `<div class="wizard-step"><span class="wizard-step-no ${ok ? 'ok' : ''}">${ok ? '✓' : num}</span><div class="wizard-step-main"><strong>${title}</strong><span>${desc}</span></div><button type="button" class="btn btn-ghost btn-sm" data-wizard-action="${action}">${actionText}</button></div>`;
}

function wizardCard() {
  const c = wizardConfigured();
  return `<div class="card settings-card wizard-card"><h3>${icon('flag')}配置向导</h3><p>按顺序配置，已经完成的会显示绿色。全部可选，不配置也能记错题。</p>
    ${wizardStep(1, 'AI 错题教练', c.ai ? '已配置 DeepSeek Key' : '分析错题、出相似题、AI 聊天', c.ai, 'go-ai', c.ai ? '查看' : '去配置')}
    ${wizardStep(2, '个人同步', c.sync ? '已连接 Gist，可多设备同步' : '电脑/平板/手机共用一份错题', c.sync, 'go-sync', c.sync ? '查看' : '去配置')}
    ${wizardStep(3, '备份', c.backup ? '已有导出或快照' : '防止清理浏览器后数据丢失', c.backup, 'go-backup', c.backup ? '查看' : '去备份')}
    <div class="setting-actions"><button type="button" class="btn btn-primary" data-wizard-action="diagnose">${icon('check')}一键诊断</button><button type="button" class="btn btn-ghost" data-wizard-action="pair" ${c.sync ? '' : 'disabled'}>${icon('image')}手机扫码配对</button></div>
    <div class="sync-install-tip">扫码配对会把 Gist ID 和 Token 编进二维码，只给自己的手机扫，不要截图发人。</div>
  </div>`;
}
const baseSettingsWizard = renderSettings;
renderSettings = function () {
  return baseSettingsWizard().replace('<div class="settings-grid">', `<div class="settings-grid">${wizardCard()}`);
};

function wizardScrollTo(title) {
  const cards = [...document.querySelectorAll('.settings-card')];
  const card = cards.find((c) => (c.querySelector('h3')?.textContent || '').includes(title));
  if (card) card.scrollIntoView({ behavior: 'smooth', block: 'center' });
}

function wizCopy(text, msg) {
  const done = () => toast(msg || '已复制');
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(done).catch(() => {
      try { const t = document.createElement('textarea'); t.value = text; document.body.appendChild(t); t.select(); document.execCommand('copy'); t.remove(); done(); } catch { toast('复制失败，请手动选择', 'error'); }
    });
  } else {
    try { const t = document.createElement('textarea'); t.value = text; document.body.appendChild(t); t.select(); document.execCommand('copy'); t.remove(); done(); } catch { toast('复制失败，请手动选择', 'error'); }
  }
}

function pairingLink() {
  const id = safeGet('cuoti_gist_id_v1');
  const token = safeGet('cuoti_gist_token_v1');
  if (!id || !token) return '';
  const payload = b64urlEncode(JSON.stringify({ id, token }));
  return location.origin + location.pathname + '#pair=' + payload;
}

function openPairing() {
  const id = safeGet('cuoti_gist_id_v1');
  const token = safeGet('cuoti_gist_token_v1');
  if (!id || !token) return toast('先在电脑上完成个人同步', 'error');
  const link = pairingLink();

        navigator.serviceWorker.register('./sw.js').catch(function (e) { console.warn('SW', e); });
      });
    }
  </script>
