  } catch { toast('恢复失败', 'error'); }
}
function help() {
  openModal(`<div class="modal-head"><div><div class="modal-kicker">QUICK START</div><h2 class="modal-title">三步开始整理错题</h2><p class="modal-sub">不需要注册，打开就能用。</p></div><button class="icon-btn" data-action="close-modal" aria-label="关闭">${icon('x')}</button></div><div class="modal-body"><div class="answer-block accent" style="margin-bottom:12px"><div class="answer-label">01 · 录入</div><p class="answer-text">点右上角“新增错题”。题干、答案、解析都可以只写关键步骤；图片支持拖拽和 Ctrl+V 粘贴。</p></div><div class="answer-block" style="margin-bottom:12px"><div class="answer-label">02 · 归因</div><p class="answer-text">选一个最具体的错因：概念不清、计算失误、审题偏差、方法不会、记忆混淆。错因比学科更能告诉你下一步补什么。</p></div><div class="answer-block" style="margin-bottom:12px"><div class="answer-label">03 · 复习</div><p class="answer-text">每天打开“今日复习”，先回忆再看答案，按真实感受评分。系统会自动安排下一次复习；连续 3 次想起来，自动标记为已掌握。</p></div><div class="about-note"><strong>重要：</strong>数据只保存在当前浏览器。换电脑、换浏览器或清理缓存前，一定要到“设置与备份”导出 JSON。</div></div><div class="modal-foot"><span></span><div class="foot-right"><button class="btn btn-primary" data-action="close-modal">开始使用</button></div></div>`, true);
}

/* ---------------- events ---------------- */
function action(el, e) {
  const a = el.dataset.action;
  const id = el.dataset.id;
  const map = {
    add: () => openForm(),
    detail: () => openDetail(id),
    edit: () => openForm(id),
    delete: () => del(id),
    star: () => star(id),
    'close-modal': () => closeModal(),
    'close-review': () => closeReview(),
    reveal: () => { if (state.review) { state.review.revealed = true; renderReview(); } },
    rate: () => rate(el.dataset.rating),
    'start-review': () => startReview(el.dataset.mode || 'due', el.dataset.id || null),
    'filter-status': () => { state.filters.status = el.dataset.status; render(); },
    'reset-filters': () => resetFilters(),
    'export-json': () => exportJSON(),
    'export-csv': () => exportCSV(),
    'import-json': () => $('#importFile')?.click(),
    print: () => printList(el.dataset.scope || 'filtered'),
    'clear-all': () => clearAll(),
    'restore-demo': () => restoreDemo(),
    'show-help': () => help(),
    'toggle-form-star': () => {
      state.formStarred = !state.formStarred;
      $('#formStarred').value = state.formStarred ? '1' : '0';
      el.classList.toggle('is-on', state.formStarred);
      el.innerHTML = `${icon('star', 'icon-sm')}<span>${state.formStarred ? '已标为重点' : '标为重点'}</span>`;
    },
    'remove-form-image': () => {
      const i = Number(el.dataset.index);
      if (Number.isInteger(i)) { state.formImages.splice(i, 1); renderFormImages(); }
    }
  };
  if (map[a]) { e.preventDefault(); map[a](); }
}
function bindGlobal() {
  document.addEventListener('click', (e) => {
    const route = e.target.closest('[data-route]');
    if (route) { e.preventDefault(); navigate(route.dataset.route); return; }
    const a = e.target.closest('[data-action]');
    if (a) action(a, e);
  });
  document.addEventListener('click', (e) => { if (e.target.matches('[data-modal-backdrop]')) closeModal(); });
  document.addEventListener('keydown', (e) => {
    const typing = e.target.matches('input, textarea, select, [contenteditable="true"]');
    if (e.key === 'Escape') {
      if (state.review) closeReview();
      else if ($('#modalRoot').innerHTML.trim()) closeModal();
      return;
    }
    if (state.review) {
      if (e.code === 'Space' && !state.review.revealed) { e.preventDefault(); state.review.revealed = true; renderReview(); return; }
      if (state.review.revealed && ['1', '2', '3', '4'].includes(e.key)) { e.preventDefault(); rate({ 1: 'again', 2: 'hard', 3: 'good', 4: 'easy' }[e.key]); }
      return;
    }
    if (typing) return;
    if (e.key.toLowerCase() === 'n') { e.preventDefault(); openForm(); }
    if (e.key === '/' && state.route === 'questions') { e.preventDefault(); $('#searchInput')?.focus(); }
  });
  document.addEventListener('keydown', (e) => {
    if (e.key !== 'Enter' && e.key !== ' ') return;
    const el = e.target.closest('[data-action="detail"]');
    if (!el) return;
    e.preventDefault(); openDetail(el.dataset.id);
  });
  const imp = $('#importFile');
  if (imp) imp.addEventListener('change', (e) => { importFile(e.target.files?.[0]); e.target.value = ''; });
  window.addEventListener('beforeunload', (e) => { if (state.review && state.review.index > 0) { e.preventDefault(); e.returnValue = ''; } });
}

/* ---------------- init ---------------- */
function showFatal(err) {
  console.error(err);
  if (!$('#view')) return;
  $('#view').innerHTML = `<div class="empty"><div class="empty-icon">${icon('alert', 'icon-lg')}</div><h3>启动时遇到了一点问题</h3><p>${esc(err?.message || err)}</p><button class="btn btn-ghost" onclick="location.reload()">重新打开</button></div>`;
}
async function init() {
  const now = new Date();
  if ($('#todayLabel')) $('#todayLabel').textContent = `${now.getMonth() + 1}月${now.getDate()}日 · ${weekday(now)}`;
  $('#view').innerHTML = '<div class="loading-skeleton">正在打开错题本…</div>';
  window.__CUOTI_READY__ = false;
  try {
    await Store.init();
    try { state.questions = (await withTimeout(Store.all(), 2200, '读取超时')).map(normalize); }
    catch { Store.mode = 'local'; state.questions = Store.local().map(normalize); }
    state.logs = loadLogs();
    if (!state.questions.length && safeGet(LS_SEEDED) !== '1') {
      state.questions = seedQuestions();
      state.logs = seedLogs(state.questions);
      try { await Store.bulk(state.questions); saveLogs(); safeSet(LS_SEEDED, '1'); } catch {}
    }
    bindGlobal();
    const params = new URLSearchParams(location.search);
    if (params.get('route') && ROUTES[params.get('route')]) state.route = params.get('route');
    render();
    window.__CUOTI_READY__ = true;
    if (params.get('open') === 'add') openForm();
    if (params.get('open') === 'detail') openDetail(params.get('id') || state.questions[0]?.id);
    if (params.get('open') === 'review') startReview('due');
    if (params.get('selftest') === '1') selftest();
    if (params.get('test') === 'flow') flowtest();
    if (params.get('debug') === '1') {
      const p = document.createElement('div');
      p.style.cssText = 'position:fixed;left:8px;bottom:8px;z-index:9999;background:#fff;border:1px solid #ccc;padding:8px;font:11px monospace;white-space:pre';
      const over = [...document.querySelectorAll('body *')]
        .filter((el) => el.getBoundingClientRect().right > window.innerWidth + 1 && getComputedStyle(el).position !== 'fixed')
        .slice(0, 8)
        .map((el) => `${el.tagName.toLowerCase()}.${String(el.className).split(' ').slice(0, 2).join('.')}`)
        .join(', ');
      p.textContent = `mode=${Store.mode}\nquestions=${state.questions.length}\nseeded=${safeGet(LS_SEEDED)}\nview=${$('#view').innerHTML.length}\ninner=${window.innerWidth} scroll=${document.documentElement.scrollWidth}\nover=${over}`;
      document.body.appendChild(p);
    }
  } catch (e) { showFatal(e); }
}
function selftest() {
  const checks = [
    ['questions', state.questions.length >= 6],
    ['due', dueQuestions().length >= 3],
    ['mastered', statusCounts().mastered >= 1],
    ['filter', filtered().length > 0],
    ['normalize', normalize({ tags: 'a, b' }).tags.length === 2],
    ['schedule', schedule({ interval: 5, correctStreak: 2 }, 'easy').status === 'mastered'],
    ['escape', esc('<b>') === '&lt;b&gt;']
  ];
  const p = checks.filter((c) => c[1]).length;
  const box = document.createElement('pre');
  box.id = 'selftest-result';
  box.textContent = `SELFTEST ${p}/${checks.length}\n` + checks.map((c) => `${c[1] ? 'PASS' : 'FAIL'} ${c[0]}`).join('\n') + `\nMODE ${Store.mode} QUESTIONS ${state.questions.length}`;
  box.style.cssText = 'position:fixed;left:0;bottom:0;z-index:9999;background:#fff;border:1px solid #ccc;padding:8px;font:11px monospace;white-space:pre';
  document.body.appendChild(box);
}

async function flowtest() {
  const checks = [];
  const add = (name, ok) => checks.push([name, Boolean(ok)]);
  const before = state.questions.length;
  openForm();
  $('#qQuestion').value = '测试题：1+1 等于多少？';
  $('#qAnswer').value = '2';
  $('#qReason').value = '计算失误';
  $('#qTopic').value = '测试';
  $('#questionForm').requestSubmit();
  await new Promise((r) => setTimeout(r, 900));
  const created = state.questions.find((q) => q.question === '测试题：1+1 等于多少？');
  add('form save', state.questions.length === before + 1 && Boolean(created));
  if (created) {
    await star(created.id);
    add('star', state.questions.find((q) => q.id === created.id)?.starred === true);
    startReview('single', created.id);
    state.review.revealed = true;
    renderReview();
    await rate('good');
    add('review rate', state.questions.find((q) => q.id === created.id)?.reviewCount === 1);
    closeReview();
  }
  const box = document.createElement('pre');
  box.id = 'flowtest-result';
  box.textContent = `FLOWTEST ${checks.filter((c) => c[1]).length}/${checks.length}\n` + checks.map((c) => `${c[1] ? 'PASS' : 'FAIL'} ${c[0]}`).join('\n');
  box.style.cssText = 'position:fixed;left:0;bottom:0;z-index:9999;background:#fff;border:1px solid #ccc;padding:8px;font:11px monospace;white-space:pre';
  document.body.appendChild(box);
}

window.__CUOTI__ = { state, Store, dueQuestions, schedule, render };
document.addEventListener('DOMContentLoaded', init);

async function rpc(name, body) {
  const res = await fetch(`${CLOUD_URL}/rest/v1/rpc/${name}`, {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json',
      apikey: CLOUD_KEY,
      Authorization: 'Bearer ' + CLOUD_KEY
    },
    body: JSON.stringify(body)
  });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) {
    throw new Error(data.message || data.error || `云端返回 ${res.status}`);
  }
  return data;
}

function latest(a, b) {
  if (!a) return b || null;
  if (!b) return a;
  return a > b ? a : b;
}

function emptyCloud() {
  return { questions: [], deleted: {}, logs: [], profile: {}, profileUpdatedAt: null, resetAt: null };

function mergeCloud(local, remote) {
  const r = remote && typeof remote === 'object' ? remote : emptyCloud();
  const l = local && typeof local === 'object' ? local : emptyCloud();
  const resetAt = latest(l.resetAt, r.resetAt);

  const deleted = { ...(r.deleted || {}) };
  for (const [id, at] of Object.entries(l.deleted || {})) {
    if (!deleted[id] || at > deleted[id]) deleted[id] = at;
  }
  if (resetAt) {
    for (const [id, at] of Object.entries(deleted)) {
      if (!at || at <= resetAt) delete deleted[id];
    }
  }

  const qmap = new Map();
  for (const q of r.questions || []) {
    if (q && q.id) qmap.set(q.id, q);
  }
  for (const q of l.questions || []) {
    if (!q || !q.id) continue;
    const old = qmap.get(q.id);
    if (!old || (q.updatedAt || '') > (old.updatedAt || '')) qmap.set(q.id, q);
  }
  for (const [id, at] of Object.entries(deleted)) {
    const q = qmap.get(id);
    if (q && (!at || at >= (q.updatedAt || ''))) qmap.delete(id);
  }
  if (resetAt) {
    for (const [id, q] of [...qmap.entries()]) {
      if ((q.updatedAt || '') <= resetAt) qmap.delete(id);
    }
  }

  const logs = new Map();
  for (const item of [...(r.logs || []), ...(l.logs || [])]) {
    if (item && item.id) logs.set(item.id, item);
  }

  let profile = r.profile || {};
  let profileUpdatedAt = r.profileUpdatedAt || null;
  if ((l.profileUpdatedAt || '') > (profileUpdatedAt || '')) {
    profile = l.profile || {};
    profileUpdatedAt = l.profileUpdatedAt;
  }

  return {
    questions: [...qmap.values()],
    deleted,
    logs: [...logs.values()].sort((a, b) => String(a.at || '').localeCompare(String(b.at || ''))).slice(-1000),
    profile,
    profileUpdatedAt,
    resetAt
  };
}

    <div class="sync-status" id="cloudStatus"><span class="sync-dot ${info.cls}"></span><strong>${info.label}</strong><span>${esc(info.text)}</span><span class="sync-when">${cloudMeta.lastSync ? esc(fmtDateTime(cloudMeta.lastSync)) : ''}</span></div>
    <div class="setting-actions">
      <button class="btn btn-primary" data-cloud-action="now">${icon('refresh')}立即同步</button>
      <button class="btn btn-ghost" data-cloud-action="install">${icon('download')}安装到桌面</button>
    </div>
    <div class="sync-install-tip"><strong>同步房间：</strong>${esc(CLOUD_ROOM)}<br>第一次请用带 <strong>#key=</strong> 的私密链接打开一次；之后会自动记住。另一台设备也用同一个私密链接打开，等几秒或点“立即同步”。</div>
  </div>`;
}
const baseSettingsCloud = renderSettings;
renderSettings = function () {
  return baseSettingsCloud().replace('<div class="settings-grid">', `<div class="settings-grid">${cloudCard()}`);
};

async function applyCloud(data, version) {
  const d = data && typeof data === 'object' ? data : emptyCloud();
  state.questions = Array.isArray(d.questions) ? d.questions.map(normalize) : [];
  state.logs = Array.isArray(d.logs) ? d.logs.slice(-1000) : [];
  cloudMeta.deleted = d.deleted && typeof d.deleted === 'object' ? d.deleted : {};
  cloudMeta.resetAt = d.resetAt || null;
  cloudMeta.version = Number(version) || 0;
  cloudMeta.lastSync = new Date().toISOString();
  saveCloudMeta();
  try { localStorage.setItem(LS_LOGS, JSON.stringify(state.logs.slice(-800))); } catch {}
  if (d.profile && typeof d.profile === 'object' && d.profileUpdatedAt) {
    if (typeof kyProfile === 'object') {
      kyProfile = { ...kyProfile, ...d.profile };
      safeSet(KY_KEY, JSON.stringify(kyProfile));
      safeSet(PROFILE_TS_KEY, d.profileUpdatedAt);
    }
  }
  try { await rawBulk(state.questions); } catch (error) { console.warn('云端数据写本地失败', error); }
  updateNav();
  updateCloudUI();
  if (canRenderNow()) render();
}

async function cloudSync(manual = false) {
  if (!cloudSecretValue) {
    cloudStatus = 'error';
    cloudMessage = '缺少私密同步码，请用带 #key= 的完整链接打开一次。';
    updateCloudUI();
    if (manual) toast('缺少私密同步码，请用完整链接打开', 'error');
    return;
  }
  if (cloudBusy) return;
  cloudBusy = true;
  cloudStatus = 'syncing';
  updateCloudUI();
  try {
    const got = await rpc('cuoti_get', { p_room: CLOUD_ROOM, p_secret: cloudSecretValue });
    const remote = got && got.found ? got.data : emptyCloud();
    let baseVersion = got && got.found ? Number(got.version) || 0 : 0;
    let merged = mergeCloud(collectCloud(), remote);
    let result = null;

    for (let attempt = 0; attempt < 3; attempt++) {
      result = await rpc('cuoti_put', {
        p_room: CLOUD_ROOM,
        p_secret: cloudSecretValue,
        p_data: merged,
        p_base_version: baseVersion
      });
      if (result && result.ok) break;
      if (result && result.conflict) {
        merged = mergeCloud(merged, result.data);
        baseVersion = Number(result.version) || 0;
        continue;
      }
      throw new Error(result?.error === 'bad_secret' ? '同步码不正确' : '云端保存失败');
    }
    if (!result || !result.ok) throw new Error('云端写入冲突，请再试一次');

    await applyCloud(result.data, result.version);
    cloudDirty = false;
    cloudStatus = 'on';
    cloudMessage = '';
    updateCloudUI();
    if (manual) toast('云端同步完成');
  } catch (error) {
    console.warn('云端同步失败', error);
    cloudDirty = true;
    cloudStatus = 'error';
    cloudMessage = error.message || '无法连接云端';
    updateCloudUI();
    if (manual) toast('云端同步失败：' + cloudMessage, 'error');
  } finally {
    cloudBusy = false;
  }
}

async function cloudPull() {
  if (!cloudSecretValue) return;
  if (cloudBusy) return;
  if (document.visibilityState !== 'visible') return;
  if ($('#modalRoot') && $('#modalRoot').innerHTML.trim()) return;
  if (cloudDirty) { await cloudSync(false); return; }
  try {
    const got = await rpc('cuoti_get', { p_room: CLOUD_ROOM, p_secret: cloudSecretValue });
    if (got && got.found && Number(got.version) !== Number(cloudMeta.version)) {
      await applyCloud(got.data, got.version);
      cloudStatus = 'on';
      cloudMessage = '';
      updateCloudUI();
    }
  } catch (error) {
    cloudStatus = 'error';
    cloudMessage = error.message || '无法连接云端';
    updateCloudUI();
  }
}

function scheduleCloud() {
  cloudDirty = true;
  clearTimeout(cloudTimer);
  cloudTimer = setTimeout(() => cloudSync(false), 800);
}

function installHelp() {
  openModal(`<div class="modal-head"><div><div class="modal-kicker">INSTALL</div><h2 class="modal-title">把错题拾遗放到桌面</h2><p class="modal-sub">云端版是网页应用，添加到桌面即可。</p></div><button class="icon-btn" data-action="close-modal" aria-label="关闭">${icon('x')}</button></div>
  <div class="modal-body">
    <div class="answer-block accent" style="margin-bottom:12px"><div class="answer-label">iPhone / Safari</div><p class="answer-text">打开这个网址 → 底部“分享” → “添加到主屏幕” → 添加。</p></div>
    <div class="answer-block accent" style="margin-bottom:12px"><div class="answer-label">Android / Chrome / Edge</div><p class="answer-text">打开网址 → 右上角菜单 → “添加到主屏幕”或“安装应用”。</p></div>
    <div class="answer-block accent" style="margin-bottom:12px"><div class="answer-label">华为浏览器</div><p class="answer-text">打开网址 → 右下角“∷” → 添加至 → 桌面。</p></div>
    <div class="about-note"><strong>提示：</strong>云端版不需要电脑开机，也不需要和电脑同一个 Wi-Fi；只要平板能上网即可。</div>
  </div><div class="modal-foot"><span></span><div class="foot-right"><button class="btn btn-primary" data-action="close-modal">知道了</button></div></div>`, true);
}

document.addEventListener('click', (event) => {
  const el = event.target.closest('[data-cloud-action]');
  if (!el) return;
  event.preventDefault();
  if (el.dataset.cloudAction === 'now') cloudSync(true);
  if (el.dataset.cloudAction === 'install') {
    if (installPrompt) {
      installPrompt.prompt();
      installPrompt.userChoice.finally(() => { installPrompt = null; });
    } else {
      installHelp();
    }
  }
});

window.addEventListener('beforeinstallprompt', (event) => {
  event.preventDefault();
  installPrompt = event;
});
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible') cloudSync(false);
});
window.addEventListener('online', () => cloudSync(false));

function startPolling() {
  if (pollTimer) clearInterval(pollTimer);
  pollTimer = setInterval(() => {
    if (document.visibilityState === 'visible') cloudPull();
  }, 12000);
}

function initCloud() {
  updateCloudUI();
  cloudSync(false);
  startPolling();
  if ('serviceWorker' in navigator && location.protocol === 'https:') {
    Promise.reject(new Error('single-file build')).catch((error) => console.warn('SW 注册失败', error));
  }
}

function bootCloud(tries = 0) {
  if (window.__CUOTI_READY__) { initCloud(); return; }
  if (tries < 100) setTimeout(() => bootCloud(tries + 1), 150);
}
document.addEventListener('DOMContentLoaded', () => setTimeout(() => bootCloud(), 300));
window.__CUOTI_CLOUD__ = { cloudSync, cloudPull, cloudMeta };

</script>
</body>
</html>
