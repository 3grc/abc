plugins {
    id 'com.android.application'
}

android {
    namespace 'com.cuoti.app'
    compileSdk 34

    defaultConfig {
        applicationId 'com.cuoti.app'
        minSdk 24
        targetSdk 34
        versionCode 2
        versionName '2.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildTypes {
        debug {
            minifyEnabled false
        }
        release {
            minifyEnabled false
        }
    }
}
